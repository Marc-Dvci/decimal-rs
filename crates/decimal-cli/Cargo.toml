[package]
name = "decimal-cli"
description = "Standalone command-line evaluator for decimal-core — the port is usable with no Node present"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Named `decimal-calc` rather than `decimal`, which collides with the `decimal`
# cdylib that decimal-napi produces: on Windows both targets want to write
# target/release/decimal.pdb, and cargo warns that one silently overwrites the
# other. The debug info of a release build is not load-bearing here, but a
# warning nobody can fix is worse than a binary with a name of its own.
[[bin]]
name = "decimal-calc"
path = "src/main.rs"

[dependencies]
decimal-core = { path = "../decimal-core" }

[lints.rust]
unsafe_code = "forbid"
