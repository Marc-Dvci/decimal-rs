# Port Mortem 2026 — submission metadata.
#
# The schema was not published with the brief, so this is a best-effort
# machine-readable summary of what the repository contains. Everything in it is
# reproducible by the command named beside it; nothing here is a claim that is
# not checkable from a clean clone.

[port]
name        = "decimal-rs"
track       = "F"
source_lang = "javascript"
target_lang = "rust"
team_size   = 1

[source]
repo    = "https://github.com/MikeMcl/decimal.js"
commit  = "cd73a7f830f07bc98e906d2ebe76e8c02cc20c8f"
version = "10.6.0"
license = "MIT"
loc     = 4952            # decimal.js, the whole implementation, one file

[build]
# The single documented command. Builds from source, verifies the test manifest,
# and runs the original suite against the compiled artifact.
command    = "docker build -t decimal-rs . && docker run --rm decimal-rs"
local      = "make"
toolchain  = "rustc 1.97.1 (pinned in rust-toolchain.toml), node 24"

[tests]
command        = "node scripts/expect-zero-failures.js"
failing        = 0
files_modified = 0
files_total    = 69
manifest       = "tests/ORIGINAL_HASHES.txt"
manifest_check = "node scripts/verify-tests.js"
# The oracle is pinned by the same check, for the same reason: a modified oracle
# would fake a clean differential campaign and leave the suite passing.
oracle_manifest = "tests/ORACLE_SHA256.txt"
# About 6,000 of the assertions are generated with Math.random(), so the
# denominator moves between runs (22,598 / 22,628 / 22,658 / 22,688 all
# observed). The strict gate parses each run's denominator and requires equality.
total_approx = 22650
note = "the random total may move; passed must equal asserted"

[tests.native]
command = "cargo test -p decimal-core"
total   = 168

[fuzz]
harness      = "fuzz/campaign.js"
inner        = "fuzz/differential.js"
oracle       = "fuzz/reference/decimal.js"
oracle_note  = "vendored copy of upstream, used only as a fuzzing oracle; not linked into the port, not reachable from its build graph"
log          = "fuzz/log.txt"
limits_log   = "fuzz/log-limits.txt"
command      = "node fuzz/campaign.js --seconds 70 --log fuzz/log.txt"
self_check   = true   # a one-ulp fault is injected and must be detected before the run starts

[fuzz.strict]
command     = "node fuzz/differential.js --strict --seconds 70 --seed 1592594996 --log fuzz/log-strict.txt"
log         = "fuzz/log-strict.txt"
operations  = 807231
api_entries = 65
actual_divergences = 0
known_waived_divergences = 0
port_defects = 0

[cli]
# A second consumer of decimal-core that has never heard of Node, so that the
# core is demonstrably a library rather than a plugin for decimal.js's host.
binary  = "target/release/decimal-calc"
example = "decimal-calc 2 sqrt --precision 40"
note    = "parses and renders through the same two core functions the addon uses; contains no arithmetic of its own"

[conformance]
# Two targeted checks, each exhaustive over an axis the original suite never
# varies. Both compare against the vendored oracle and count their documented
# divergences rather than filtering them out.
clamp        = "node scripts/clamp-conformance.js"
clamp_scope  = "67 methods x 6 operands x 4 exponent-limit pairs, x 9 rounding modes where one is taken, in receiver and in argument position = 3528 calls"
clamp_note   = "operands built under wide limits, limits narrowed before the call; DECISIONS.md D-12, D-18, D-21"
host         = "node scripts/host-limits.js"
host_scope   = "the array ceiling V8 enforces, measured live and compared with MAX_ARRAY_LENGTH"
host_note    = "DECISIONS.md D-10, D-19"

[safety]
unsafe_core           = 0
unsafe_cli            = 0
unsafe_adapter        = 92
method                = "unsafe_code = \"forbid\" in decimal-core and decimal-cli, compiler-enforced; textual cross-check in scripts/unsafe-report.js"
command               = "node scripts/unsafe-report.js"
dependencies_core     = 0
dependencies_workspace = 1   # napi-sys, bindings only

[bench]
command  = "node bench/run.js"
report   = "bench/README.md"
method   = "bench/methodology.md"
data     = "bench/results.json"

[soak]
command = "node scripts/soak.js"
data    = "bench/soak.json"

[findings]
# Defects found in the original. Write-ups in docs/upstream/.
count       = 8
crashes     = 4
hangs       = 2
index       = "docs/upstream/README.md"
repro       = "node fuzz/repro-upstream.js"
# The command above covers BUG-002..006 and BUG-008, plus two cost findings.
# BUG-001's high-precision oracle analysis is preserved in its write-up.
# BUG-007 is reproduced by the host-limit check rather than by repro-upstream.js,
# because it is a threshold rather than a single input.
repro_007   = "node scripts/host-limits.js"
filing_status = "GitHub issue creation is restricted upstream; no issues could be filed"

[docs]
decisions = "DECISIONS.md"
upstream  = "docs/upstream/README.md"
